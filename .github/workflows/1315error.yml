name: Test setup-python PR 1315

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # Test 1: Happy path - caching works with a valid requirements.txt
  test-cache-happy-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create requirements.txt
        run: echo "requests==2.31.0" > requirements.txt
      # - uses: aroudaki70/setup-python@error-message-update
      - uses: lmvysakh/setup-python@err_msg_updation
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python --version

  # Test 2: Trigger the updated error message - no dependency file exists
  test-cache-missing-dependency-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no requirements.txt exists
        run: rm -f requirements.txt
        # - uses: aroudaki70/setup-python@error-message-update
      - uses: lmvysakh/setup-python@err_msg_updation
        id: setup
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'nonexistent-requirements.txt'
        continue-on-error: true
      - name: Verify improved error message
        if: steps.setup.outcome == 'failure'
        run: echo "Expected failure - check logs above for the updated error message containing package manager and cache-dependency-path details"

  # Test 3: Trigger error with pipenv
  test-cache-missing-pipenv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # - uses: aroudaki70/setup-python@error-message-update
      - uses: lmvysakh/setup-python@err_msg_updation
        id: setup
        with:
          python-version: '3.12'
          cache: 'pipenv'
          cache-dependency-path: 'nonexistent-Pipfile.lock'
        continue-on-error: true
      - name: Verify error mentions pipenv
        if: steps.setup.outcome == 'failure'
        run: echo "Expected failure - check logs for 'pipenv' and 'cache-dependency-path = nonexistent-Pipfile.lock' in the error message"

  # Test 4: No checkout - original error path
  test-cache-no-checkout:
    runs-on: ubuntu-latest
    steps:
        # - uses: aroudaki70/setup-python@error-message-update
      - uses: lmvysakh/setup-python@err_msg_updation
        id: setup
        with:
          python-version: '3.12'
          cache: 'pip'
        continue-on-error: true
      - name: Verify error message
        if: steps.setup.outcome == 'failure'
        run: echo "Expected failure - verify error mentions checking out the target repository"