name: Test PYTHON_VERSION_REQUIRED feature (PR #1088)

on:
  workflow_dispatch:
  push: 
    branches:
      - main

jobs:
  # TEST 1: PYTHON_VERSION_REQUIRED=true WITHOUT python-version
  # Expected: Action FAILS with error
  should-fail-when-required-and-missing:
    name: "Should FAIL - required=true, no version (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should fail)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: true
        continue-on-error: true


    
  # TEST 2: PYTHON_VERSION_REQUIRED=true WITH python-version
  # Expected: Action SUCCEEDS (version is provided)
  should-pass-when-required-and-provided:
    name: "Should PASS - required=true, version provided (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should succeed)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        with:
          python-version: "3.12"
        env:
          PYTHON_VERSION_REQUIRED: true


  # TEST 3: NO PYTHON_VERSION_REQUIRED, NO python-version
  # Expected: Action SUCCEEDS with a WARNING (existing behavior)
  should-warn-when-not-required-and-missing:
    name: "Should WARN - env not set, no version (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should succeed with warning)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required

  
  # TEST 4: PYTHON_VERSION_REQUIRED=false, NO python-version
  # Expected: Action SUCCEEDS with a WARNING (treated as not required)
  should-warn-when-explicitly-false:
    name: "Should WARN - required=false, no version (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should succeed with warning)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: false


  # TEST 5: Case sensitivity - PYTHON_VERSION_REQUIRED=True
  # Expected: Action FAILS (PR accepts 'True')
  should-fail-with-capitalized-true:
    name: "Should FAIL - required=True (capitalized) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should fail)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: "True"
        continue-on-error: true


  # TEST 6: Case sensitivity - PYTHON_VERSION_REQUIRED=TRUE
  # Expected: Action FAILS (PR accepts 'TRUE')
  should-fail-with-uppercase-true:
    name: "Should FAIL - required=TRUE (uppercase) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should fail)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: "TRUE"
        continue-on-error: true



  # TEST 7: Edge case - PYTHON_VERSION_REQUIRED=tRuE (mixed case)
  # Expected: Action SUCCEEDS with warning (PR does NOT handle this)
  # This test documents the known limitation of the PR
  should-warn-with-mixed-case-true:
    name: "Edge case - required=tRuE (mixed case, known gap) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (will succeed due to case mismatch)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: "tRuE"


  # TEST 8: Edge case - PYTHON_VERSION_REQUIRED=yes
  # Expected: Action SUCCEEDS with warning (not a recognized truthy value)
  should-warn-with-yes:
    name: "Edge case - required=yes (not recognized) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should succeed - 'yes' is not recognized)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: "yes"

  # TEST 9: Edge case - PYTHON_VERSION_REQUIRED=1
  # Expected: Action SUCCEEDS with warning (not a recognized truthy value)
  should-warn-with-one:
    name: "Edge case - required=1 (not recognized) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should succeed - '1' is not recognized)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: "1"

  # TEST 10: PYTHON_VERSION_REQUIRED=true WITH python-version-file
  # Expected: Action SUCCEEDS (version resolved from file)
  should-pass-when-required-and-version-file-provided:
    name: "Should PASS - required=true, version from file (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Create .python-version file
        run: echo "3.12" > .python-version

      - name: Setup Python (should succeed - version comes from file)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        with:
          python-version-file: .python-version
        env:
          PYTHON_VERSION_REQUIRED: true


  # TEST 11: Empty string value - PYTHON_VERSION_REQUIRED=""
  # Expected: Action SUCCEEDS with warning (empty = not set)
  should-warn-with-empty-string:
    name: "Should WARN - required='' (empty string) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (should succeed with warning)
        id: setup-python
        uses: kmasuda050/setup-python@feature/python-version-required
        env:
          PYTHON_VERSION_REQUIRED: ""
